# 打 v* 标签（如 v0.2.0）时构建 macOS / Windows 桌面安装包和 Web 静态包，汇总到一个草稿 Release。
# 确认安装包无误后，在 GitHub Releases 页面手动点 “Publish release”。
# 手动触发（Actions → 发布桌面端 → Run workflow）只构建并上传 Actions 产物，不创建 Release。
#
# 代码签名是可选的：不配置时产出未签名安装包（macOS 需右键“打开”，Windows 会出现 SmartScreen 提示）。
# 需要签名时按 docs/deployment.md 在 Settings → Secrets and variables → Actions 中配置。
name: 发布桌面端

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  create-release:
    name: 创建草稿 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - name: 标签需与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::标签 v$tag 与 package.json 版本 $pkg 不一致，请先更新 package.json"
            exit 1
          fi
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "个人记账 $GITHUB_REF_NAME" \
            --notes "下载对应平台的安装包：macOS 选 .dmg（Apple Silicon 选 aarch64，Intel 选 x64），Windows 选 .exe 或 .msi。未签名版本在 macOS 首次打开需在“访达”中右键选择“打开”。"
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: 构建 ${{ matrix.name }}
    needs: create-release
    # 手动触发时 create-release 被跳过，仍然继续构建
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 以下签名变量未配置时为空，构建会跳过签名
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }}
          # 为空时只构建不上传（手动触发）
          releaseId: ${{ needs.create-release.outputs.release_id }}
      - name: 上传构建产物（手动触发时）
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: ignore

  web-bundle:
    name: 打包 Web 静态文件
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cd dist && zip -qr "../personal-bookkeeping-web-${GITHUB_REF_NAME}.zip" .
      - name: 附加到草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" personal-bookkeeping-web-*.zip --clobber

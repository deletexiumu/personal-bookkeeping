# 「检查」和「识别改动范围」两个任务跑在哪种机器上，由仓库的 Actions 变量 CI_RUNS_ON 决定，值是 runs-on 的 JSON 写法：
#   没设这个变量                         GitHub 托管的 ubuntu-latest
#   ["self-hosted","linux","x64"]        自托管运行器
# 其余任务固定在托管机器上：后端测试用了 services，镜像构建检查用了 Docker，自托管运行器的容器里都没有；
# 桌面端编译检查依赖 rust-cache 的远端缓存。
# 自托管运行器的依赖缓存留在本机磁盘上，setup-node 的远端缓存只在托管机器上启用。
# 警告：自托管运行器只给私有仓库注册。仓库公开时不应设这个变量，否则这两个任务会一直排队。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review：草稿转为正式 PR 时重新跑一次，以便触发自动合并
    types: [opened, synchronize, reopened, ready_for_review]
  # 自动合并后由 auto-merge.yml 派发（GITHUB_TOKEN 的推送不会触发 push 事件）
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 检查（lint / test / build）
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  server:
    name: 后端（typecheck / test，PGlite 与 PostgreSQL）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taozhubu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taozhubu/server typecheck
      - run: pnpm --filter @taozhubu/server build
      - name: 测试（内嵌 PGlite）
        run: pnpm --filter @taozhubu/server test
      - name: 测试（PostgreSQL 16）
        run: pnpm --filter @taozhubu/server test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/taozhubu_test

  changes:
    name: 识别改动范围
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      docker: ${{ steps.filter.outputs.docker }}
      server-docker: ${{ steps.filter.outputs.server-docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'src-tauri/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'deploy/docker/**'
              - 'pnpm-workspace.yaml'
              - 'server/package.json'
            server-docker:
              - 'server/**'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  desktop:
    name: 桌面端编译检查
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 WebKitGTK 等系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! 需要 dist 目录存在
      - run: pnpm build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

  docker:
    name: Docker 镜像构建检查
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  server-docker:
    name: 后端镜像构建检查
    needs: changes
    if: needs.changes.outputs.server-docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: taozhubu-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: 启动镜像并检查健康接口
        run: |
          docker run -d --name api -p 8787:8787 --tmpfs /data:uid=1000,gid=1000 -e COOKIE_SECURE=false taozhubu-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/healthz; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

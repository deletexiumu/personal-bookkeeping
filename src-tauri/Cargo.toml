[package]
name = "personal-bookkeeping"
version = "0.1.0"
description = "金匮簿桌面端（macOS / Windows），复用 Web 前端"
authors = ["deletexiumu"]
license-file = "../LICENSE"
repository = "https://github.com/deletexiumu/personal-bookkeeping"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
